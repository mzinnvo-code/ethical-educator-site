<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Telemetry buffer init — runs synchronously before any module script
         so DevTools smoke checks (`window.__teeEvents`) return [] from the
         very first paint, never undefined. The analytics module also inits
         this lazily, but doing it inline guarantees the buffer exists even
         if the module is in a separate chunk that hasn't loaded yet. -->
    <script>window.__teeEvents = window.__teeEvents || [];</script>

    <!-- Font Loading (preconnect eliminates FOUT by fetching before React renders) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">

    <!-- Primary Meta -->
    <title>The Ethical Educator</title>
    <meta name="description" content="Classroom-ready thought experiments, educator resources, and research-backed AI ethics guidance for teachers and school leaders navigating AI in education." />
    <meta name="author" content="Matthew A. Zinn" />
    <meta name="keywords" content="philosophy, AI ethics, education, moral psychology, pedagogy, philosophy of education" />
    <meta name="theme-color" content="#0b1622" />
    <link rel="canonical" href="https://theethicaleducator.com" />

    <!-- Open Graph -->
    <meta property="og:title" content="The Ethical Educator" />
    <meta property="og:description" content="Classroom-ready thought experiments, educator resources, and research-backed AI ethics guidance for teachers and school leaders navigating AI in education." />
    <meta property="og:image" content="/illustrations/home-hero.png" />
    <meta property="og:url" content="https://theethicaleducator.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Ethical Educator" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Ethical Educator" />
    <meta name="twitter:description" content="Classroom-ready thought experiments, educator resources, and research-backed AI ethics guidance for teachers and school leaders navigating AI in education." />
    <meta name="twitter:image" content="/illustrations/home-hero.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Syndication feeds (changelog of new thought experiments, research, features) -->
    <link rel="alternate" type="application/rss+xml" title="The Ethical Educator — What's New (RSS)" href="/feed.xml" />
    <link rel="alternate" type="application/feed+json" title="The Ethical Educator — What's New (JSON Feed)" href="/feed.json" />

    <!-- Structured Data: Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Matthew A. Zinn",
      "jobTitle": "Philosopher and Educator",
      "description": "Researcher in moral psychology, AI ethics, and philosophy of education",
      "url": "https://theethicaleducator.com",
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "University of North Carolina at Charlotte"
      },
      "sameAs": [
        "https://ethicalaiedu.wordpress.com",
        "https://innovateedai.com"
      ]
    }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "The Ethical Educator",
      "url": "https://theethicaleducator.com",
      "description": "Classroom-ready thought experiments, educator resources, and research-backed AI ethics guidance for teachers and school leaders."
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "The Ethical Educator",
      "url": "https://theethicaleducator.com",
      "logo": "https://theethicaleducator.com/favicon.svg",
      "description": "Classroom-ready thought experiments, educator resources, and research-backed AI ethics guidance for teachers and school leaders navigating AI in education.",
      "founder": {
        "@type": "Person",
        "name": "Matthew A. Zinn"
      },
      "sameAs": [
        "https://ethicalaiedu.wordpress.com",
        "https://innovateedai.com"
      ]
    }
    </script>

    <!-- Cloudflare Web Analytics
         Cookieless, GDPR-clean, no PII. Setup steps: docs/cloudflare-runbook.md
         Replace REPLACE_WITH_CLOUDFLARE_TOKEN with the token from
         dash.cloudflare.com → Web Analytics → Add a site → theethicaleducator.com.
         The "spa": true flag tells the beacon to report on SPA route changes. -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "510341a8a120458f8fe313de1c65aa52", "spa": true}'></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
