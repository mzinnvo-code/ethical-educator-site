  <g class="sans shadowText">
    <text x="130" y="371" text-anchor="middle" class="label teal">inputs from</text>
    <text x="130" y="394" text-anchor="middle" class="label teal">other neurons</text>
    <text x="862" y="250" text-anchor="middle" class="label gold">electrical impulse</text>
    <text x="1360" y="350" text-anchor="middle" class="label gold">neurotransmitters</text>
    <text x="1360" y="373" text-anchor="middle" class="label gold">cross the synapse</text>
    <text x="470" y="423" text-anchor="middle" class="copy">cell body</text>
    <text x="470" y="445" text-anchor="middle" class="copy">(soma)</text>
    <text x="774" y="431" text-anchor="middle" class="copy">axon</text>
    <text x="1218" y="423" text-anchor="middle" class="copy">axon terminals</text>
    <text x="1218" y="445" text-anchor="middle" class="copy">(synapses)</text>
  </g>

  <g class="sans">
    <text x="72" y="523" class="blue" font-size="38" font-weight="900">Artificial Neuron</text>
    <g class="blue">
      <circle cx="430" cy="503" r="12" fill="none" stroke="#3d9cff" stroke-width="3"/>
      <text x="426" y="509" font-size="16" font-weight="900">1</text>
      <text x="454" y="503" class="stepHead blue">Inputs</text>
      <text x="454" y="531" class="stepCopy" fill="#f4f0e8">Features enter the</text>
      <text x="454" y="553" class="stepCopy" fill="#f4f0e8">model as numeric</text>
      <text x="454" y="575" class="stepCopy" fill="#f4f0e8">values.</text>

      <circle cx="650" cy="503" r="12" fill="none" stroke="#3d9cff" stroke-width="3"/>
      <text x="646" y="509" font-size="16" font-weight="900">2</text>
      <text x="674" y="503" class="stepHead blue">Weighted Sum</text>
      <text x="674" y="531" class="stepCopy" fill="#f4f0e8">Inputs are scaled by</text>
      <text x="674" y="553" class="stepCopy" fill="#f4f0e8">weights and summed</text>
      <text x="674" y="575" class="stepCopy" fill="#f4f0e8">together, plus bias.</text>

      <circle cx="918" cy="503" r="12" fill="none" stroke="#3d9cff" stroke-width="3"/>
      <text x="914" y="509" font-size="16" font-weight="900">3</text>
      <text x="942" y="503" class="stepHead blue">Activation</text>
      <text x="942" y="531" class="stepCopy" fill="#f4f0e8">The activation function</text>
      <text x="942" y="553" class="stepCopy" fill="#f4f0e8">introduces non-linearity</text>
      <text x="942" y="575" class="stepCopy" fill="#f4f0e8">to decide the response.</text>

      <circle cx="1202" cy="503" r="12" fill="none" stroke="#3d9cff" stroke-width="3"/>
      <text x="1198" y="509" font-size="16" font-weight="900">4</text>
      <text x="1226" y="503" class="stepHead blue">Output</text>
      <text x="1226" y="531" class="stepCopy" fill="#f4f0e8">The output is passed</text>
      <text x="1226" y="553" class="stepCopy" fill="#f4f0e8">to the next layer or</text>
      <text x="1226" y="575" class="stepCopy" fill="#f4f0e8">used for predictions.</text>
    </g>
  </g>

