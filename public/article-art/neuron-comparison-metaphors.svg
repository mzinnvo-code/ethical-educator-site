  <text x="265" y="926" class="sans shadowText" fill="#f4f0e8" font-size="18" font-weight="850">Artificial neurons borrow language from biology, but they abstract away metabolism, cellular repair, chemical signaling, and</text>
  <text x="265" y="953" class="sans shadowText" fill="#f4f0e8" font-size="18" font-weight="850">embodiment.</text>
